<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1E88E5">
  <meta name="description" content="ROCIs Schedule - Master your semester with weekly timetables, GPA tracker, exam countdowns, and assignment management.">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ROCIs Schedule - Timetable & Student Planner">
  <meta property="og:description" content="Master your semester with weekly timetables, GPA tracker, exam countdowns, and assignment management.">
  <meta property="og:image" content="favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ROCIs Schedule">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In SDK configuration for Web -->
  <meta name="google-signin-client_id" content="318456267857-u9mr5ssmdd76944000ggf34vv7pkqufc.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <title>ROCIs Schedule - Timetable & Student Planner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
    }
    .spinner {
      border: 4px solid rgba(248, 250, 252, 0.1);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border-left-color: #1E88E5;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      margin-top: 24px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .tagline {
      margin-top: 8px;
      font-size: 15px;
      color: rgba(248, 250, 252, 0.7);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-container">
      <div class="spinner"></div>
      <div class="title">ROCIs Schedule</div>
      <div class="tagline">Master your semester &bull; Timetable &amp; Planner</div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loadingDiv = document.getElementById("loading");
      if (loadingDiv) {
        loadingDiv.style.transition = "opacity 0.3s ease";
        loadingDiv.style.opacity = "0";
        setTimeout(function() {
          loadingDiv.remove();
        }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
